<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>General English by Teacher Durbek</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #07080a;
    --text: #f4f5f7;
    --muted: #9aa0a8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 28px; }
  h1 { font-size: 26px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
  .by { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .hello { margin: 18px 0 6px; font-size: 16px; }
  .label { color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin: 18px 0 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { border: 0; text-align: left; color: var(--text); border-radius: 16px; padding: 16px 16px 18px;
    min-height: 128px; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start;
    transition: transform .08s ease, filter .15s ease; font: inherit; }
  .card:active { transform: scale(.97); filter: brightness(1.25); }
  .card.wide { grid-column: span 2; min-height: 96px; }
  .card svg { width: 26px; height: 26px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card .t { font-size: 19px; font-weight: 700; margin-top: 14px; line-height: 1.2; }
  .card .s { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.3; }
  .blue   { background: #0b1324; } .blue svg   { stroke: #4c8dff; }
  .green  { background: #08190f; } .green svg  { stroke: #2fbf71; }
  .amber  { background: #1d1306; } .amber svg  { stroke: #f08a24; }
  .purple { background: #140f26; } .purple svg { stroke: #a77bff; }
  .rose   { background: #1e0c13; } .rose svg   { stroke: #ef5b93; }
  .teal   { background: #06191a; } .teal svg   { stroke: #2cc2b0; }
  .indigo { background: #0f1028; } .indigo svg { stroke: #7a83ff; }
  .cyan   { background: #071722; } .cyan svg   { stroke: #38b6e8; }
  .gray   { background: #16181c; } .gray svg   { stroke: #e6e8eb; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #22262c;
    color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>General English</h1>
  <div class="by">by Teacher Durbek</div>
  <div class="hello" id="hello">Assalomu alaykum! 👋</div>

  <div class="label">O'quvchi paneli</div>
  <div class="grid">
    <button class="card blue" data-open="daily">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      <div class="t">Kunlik darslar</div><div class="s">Har kuni bitta dars</div>
    </button>
    <button class="card green" data-open="tests">
      <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
      <div class="t">Testlar</div><div class="s">Essential va grammatika</div>
    </button>
    <button class="card rose" data-open="textbook">
      <svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
      <div class="t">Darsliklar</div><div class="s">Kitoblar va unitlar</div>
    </button>
    <button class="card teal" data-open="reading">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg>
      <div class="t">Reading</div><div class="s">O'qish materiallari</div>
    </button>
    <button class="card amber" data-open="listening">
      <svg viewBox="0 0 24 24"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"/></svg>
      <div class="t">Listening</div><div class="s">Audio va mashqlar</div>
    </button>
    <button class="card purple" data-open="speaking">
      <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
      <div class="t">Speaking</div><div class="s">Gapirish materiallari</div>
    </button>
    <button class="card indigo" data-open="tasks">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <div class="t">Vazifalarim</div><div class="s">Ustoz bergan vazifalar</div>
    </button>
    <button class="card cyan" data-open="videos">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
      <div class="t">Video darslar</div><div class="s">Grammatika videolari</div>
    </button>
    <button class="card gray wide" data-open="progress">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-3M11 16V9M15 16v-5M19 16V6"/></svg>
      <div class="t">Natijalarim</div><div class="s">Ballar, vazifalar va yutuqlar</div>
    </button>
  </div>
  <div class="foot">Bo'limni tanlang — bot shu bo'limni ochadi</div>
</div>
<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#07080a'); tg.setBackgroundColor('#07080a'); } catch (e) {}
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u && u.first_name) {
      document.getElementById('hello').textContent = 'Assalomu alaykum, ' + u.first_name + '! 👋';
    }
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.open;
      if (tg && tg.sendData && tg.initData !== undefined) {
        try { tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
        tg.sendData(JSON.stringify({ open: key }));   // the bot opens this section; the page closes
      } else {
        toast('Bu sahifa Telegram ichida ishlaydi (📱 Dashboard tugmasi)');
      }
    });
  });
</script>
</body>
</html>
